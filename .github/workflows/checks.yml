name: Verificar sistema

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Validar regras e lógica
        run: npm run check
      - name: Montar versão de produção
        run: npm run build

