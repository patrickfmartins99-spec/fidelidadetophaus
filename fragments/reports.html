<template id="template-aba-relatorios">
    <section id="aba-relatorios" class="hidden space-y-6" aria-labelledby="titulo-relatorios">
        <div class="report-header">
            <div>
                <p class="report-eyebrow">Visão administrativa</p>
                <h1 id="titulo-relatorios" class="report-title">Relatórios e fluxo</h1>
                <p class="report-subtitle">Acompanhe o movimento da unidade e a frequência dos clientes.</p>
            </div>
            <label class="report-date-control">
                <span>Dia do relatório</span>
                <input type="date" id="relatorio-data" aria-label="Dia do relatório diário">
            </label>
        </div>

        <div class="report-section-heading">
            <div>
                <h2>Resumo do dia</h2>
                <p id="relatorio-dia-legenda">Movimento registrado na data selecionada.</p>
            </div>
        </div>

        <div class="report-kpi-grid">
            <article class="report-kpi">
                <span class="report-kpi-icon report-kpi-icon--blue"><i data-lucide="user-plus"></i></span>
                <div><p>Novos clientes</p><strong id="relatorio-novos">0</strong><small>cadastros no dia</small></div>
            </article>
            <article class="report-kpi">
                <span class="report-kpi-icon report-kpi-icon--green"><i data-lucide="users"></i></span>
                <div><p>Clientes atendidos</p><strong id="relatorio-visitantes">0</strong><small>pessoas diferentes</small></div>
            </article>
            <article class="report-kpi">
                <span class="report-kpi-icon report-kpi-icon--amber"><i data-lucide="utensils"></i></span>
                <div><p>Almoços registrados</p><strong id="relatorio-almocos">0</strong><small>lançamentos no dia</small></div>
            </article>
            <article class="report-kpi">
                <span class="report-kpi-icon report-kpi-icon--purple"><i data-lucide="gift"></i></span>
                <div><p>Prêmios resgatados</p><strong id="relatorio-resgates">0</strong><small id="relatorio-resgates-detalhe">0 fidelidade · 0 aniversário</small></div>
            </article>
        </div>
        <p class="report-method-note">Os totais usam os registros digitais dos cadastros não arquivados disponíveis nesta unidade; um cadastro arquivado pode deixar de compor relatórios de datas anteriores.</p>

        <div class="report-section-heading report-section-heading--spaced">
            <div>
                <h2>Análise de fluxo</h2>
                <p id="relatorio-periodo-legenda">30 dias completos até a data selecionada.</p>
            </div>
        </div>

        <div class="report-flow-grid">
            <article class="report-panel report-flow-chart-panel">
                <div class="report-panel-title report-panel-title--wrap">
                    <div><h3>Movimento diário</h3><p id="relatorio-grafico-legenda">Almoços por dia nos últimos 14 dias do período.</p></div>
                    <label class="report-chart-control">Mostrar <select id="relatorio-grafico-periodo" aria-label="Dias exibidos no gráfico"><option value="14">14 dias</option><option value="30">30 dias</option></select></label>
                </div>
                <div class="report-chart-scroll"><div id="relatorio-grafico" class="report-chart" role="list" aria-label="Almoços registrados por dia"></div></div>
            </article>

            <article class="report-panel">
                <div class="report-panel-title report-panel-title--wrap"><div><h3>Resumo do período</h3><p id="relatorio-resumo-legenda">30 dias completos comparados aos 30 dias anteriores.</p></div><span id="relatorio-variacao" class="report-trend">—</span></div>
                <dl class="report-summary-list">
                    <div><dt>Almoços registrados</dt><dd id="relatorio-fluxo-almocos">0</dd></div>
                    <div><dt>Clientes atendidos</dt><dd id="relatorio-fluxo-clientes">0</dd></div>
                    <div><dt>Média por dia</dt><dd id="relatorio-media-dia">0</dd></div>
                    <div><dt>Almoços nos 30 dias anteriores</dt><dd id="relatorio-anterior-almocos">0</dd></div>
                    <div><dt>Variação entre os períodos</dt><dd id="relatorio-comparacao">—</dd></div>
                </dl>
            </article>
        </div>

        <article class="report-panel">
            <div class="report-panel-title report-panel-title--wrap">
                <div><h3>Perfil de frequência</h3><p id="relatorio-perfil-legenda">Almoços nos 30 dias do período, sem reiniciar após resgates.</p></div>
                <div class="report-legend">
                    <span><i class="report-dot report-dot--frequente"></i>Frequente: 8+</span>
                    <span><i class="report-dot report-dot--regular"></i>Regular: 4–7</span>
                    <span><i class="report-dot report-dot--ocasional"></i>Ocasional: 1–3</span>
                    <span><i class="report-dot report-dot--novo"></i>Novo: cadastro no período e até 3 almoços</span>
                    <span><i class="report-dot report-dot--inativo"></i>Inativo: nenhum almoço no período</span>
                </div>
            </div>
            <div id="relatorio-segmentos" class="report-segments"></div>
            <p id="relatorio-perfil-base" class="report-method-note">Base: cadastros não arquivados da unidade. “Novo” tem prioridade sobre “Ocasional” e “Inativo”.</p>
        </article>

        <article class="report-panel report-table-panel">
            <div class="report-panel-title report-panel-title--wrap">
                <div><h3>Frequência por cliente</h3><p id="relatorio-tabela-legenda">Visitas em 30 e 90 dias; o resgate altera o saldo, não apaga as visitas documentadas.</p></div>
                <label class="report-search"><i data-lucide="search"></i><input id="relatorio-busca" type="search" placeholder="Buscar cliente" autocomplete="off"></label>
            </div>
            <p class="report-method-note">Última visita: data mais recente do histórico disponível até o dia selecionado. Intervalo médio e dia mais comum consideram datas distintas nos últimos 90 dias. A ficha mostra saldo, resgates e linha do tempo.</p>
            <div class="responsive-table report-table-wrap" data-mobile-cards="frequencia">
                <table class="w-full text-left border-collapse">
                    <thead><tr>
                        <th>Cliente</th><th>Última visita registrada</th><th>Almoços · 30 dias</th><th>Almoços · 90 dias</th><th>Média mensal · 90 dias</th><th>Intervalo médio · 90 dias</th><th>Dia mais comum · 90 dias</th><th>Perfil · 30 dias</th><th>Ação</th>
                    </tr></thead>
                    <tbody id="relatorio-tabela-clientes"></tbody>
                </table>
            </div>
            <p id="relatorio-tabela-contagem" class="report-table-count"></p>
        </article>
    </section>
</template>
